<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Header 高度 · 已采用 25%</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #1d1d1f;
        background: #f5f5f7;
        font-family: Arial, 'Microsoft YaHei', sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      main {
        max-width: 1504px;
        margin: auto;
        padding: 28px 32px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: -0.025em;
      }
      p {
        margin: 0;
        color: #555;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 20px 0 24px;
      }
      button {
        cursor: pointer;
        border: 1px solid #ccc;
        background: white;
        padding: 9px 16px;
        border-radius: 6px;
        font: inherit;
      }
      button[aria-pressed='true'] {
        background: #1d1d1f;
        border-color: #1d1d1f;
        color: white;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #305ac6;
        outline-offset: 4px;
      }
      a {
        color: #234da9;
        text-decoration: none;
        white-space: nowrap;
      }
      a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .option {
        margin-bottom: 22px;
        min-width: 0;
      }
      .caption {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 10px 20px;
        margin-bottom: 10px;
      }
      h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      .height {
        margin-left: 8px;
        font-size: 16px;
        color: #666;
        font-weight: 400;
      }
      .note {
        color: #666;
      }
      .caption a {
        margin-left: auto;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        background: #1d1d1f;
      }
      .footnote {
        font-size: 14px;
        margin-top: 8px;
      }
      body[data-mode='mobile'] .options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 390px));
        gap: 8px 32px;
        justify-content: center;
      }
      body[data-mode='mobile'] .caption {
        gap: 6px 12px;
      }
      body[data-mode='mobile'] .note {
        width: 100%;
        order: 3;
      }
      @media (max-width: 600px) {
        main {
          padding: 24px 16px;
        }
        h1 {
          font-size: 24px;
        }
        .caption {
          gap: 4px 12px;
        }
        .note {
          width: 100%;
          order: 3;
        }
        body[data-mode='mobile'] .options {
          grid-template-columns: minmax(0, 390px);
        }
      }
    </style>
  </head>
  <body data-mode="desktop">
    <main>
      <h1>Header 高度 · 已采用 25%</h1>
      <p>Logo 与搜索图标保持居中；导航按「左上角方块＋文字」的整体垂直居中。</p>
      <div class="toolbar" role="group" aria-label="对比设备">
        <button type="button" data-mode="desktop" aria-pressed="true">桌面 · 1440px</button>
        <button type="button" data-mode="mobile" aria-pressed="false">手机 · 390px</button>
      </div>
      <div class="options">
        <section class="option" aria-labelledby="label-25">
          <div class="caption">
            <h2 id="label-25">
              缩小 25% <span class="height" data-desktop="72" data-mobile="60">72px</span>
            </h2>
            <span class="note">已选定 · 当前默认</span>
            <a href="http://localhost:3000/research/" target="_blank" rel="noopener">整页预览 ↗</a>
          </div>
          <img
            src="screenshots/desktop-25.png"
            data-reduction="25"
            alt="已选定的 25% Header，导航按方块加文字整体居中"
            width="1440"
            height="132"
          />
        </section>
        <section class="option" aria-labelledby="label-0">
          <div class="caption">
            <h2 id="label-0">
              原高度 <span class="height" data-desktop="96" data-mobile="80">96px</span>
            </h2>
            <span class="note">对照基准</span
            ><a
              href="http://localhost:3000/research/?headerReduction=0"
              target="_blank"
              rel="noopener"
              >整页预览 ↗</a
            >
          </div>
          <img
            src="screenshots/desktop-0.png"
            data-reduction="0"
            alt="原高度的真实 Header 截图，Logo 与搜索图标居中，导航按方块加文字整体居中"
            width="1440"
            height="132"
          />
        </section>
        <section class="option" aria-labelledby="label-10">
          <div class="caption">
            <h2 id="label-10">
              缩小 10% <span class="height" data-desktop="86.4" data-mobile="72">86.4px</span>
            </h2>
            <span class="note">轻微收紧</span
            ><a
              href="http://localhost:3000/research/?headerReduction=10"
              target="_blank"
              rel="noopener"
              >整页预览 ↗</a
            >
          </div>
          <img
            src="screenshots/desktop-10.png"
            data-reduction="10"
            alt="缩小 10%的真实 Header 截图，Logo 与搜索图标居中，导航按方块加文字整体居中"
            width="1440"
            height="132"
          />
        </section>
        <section class="option" aria-labelledby="label-20">
          <div class="caption">
            <h2 id="label-20">
              缩小 20% <span class="height" data-desktop="76.8" data-mobile="64">76.8px</span>
            </h2>
            <span class="note">适度收紧</span
            ><a
              href="http://localhost:3000/research/?headerReduction=20"
              target="_blank"
              rel="noopener"
              >整页预览 ↗</a
            >
          </div>
          <img
            src="screenshots/desktop-20.png"
            data-reduction="20"
            alt="缩小 20%的真实 Header 截图，Logo 与搜索图标居中，导航按方块加文字整体居中"
            width="1440"
            height="132"
          />
        </section>
        <section class="option" aria-labelledby="label-30">
          <div class="caption">
            <h2 id="label-30">
              缩小 30% <span class="height" data-desktop="67.2" data-mobile="56">67.2px</span>
            </h2>
            <span class="note">最紧凑</span
            ><a
              href="http://localhost:3000/research/?headerReduction=30"
              target="_blank"
              rel="noopener"
              >整页预览 ↗</a
            >
          </div>
          <img
            src="screenshots/desktop-30.png"
            data-reduction="30"
            alt="缩小 30%的真实 Header 截图，Logo 与搜索图标居中，导航按方块加文字整体居中"
            width="1440"
            height="132"
          />
        </section>
      </div>
      <p class="footnote" id="context">
        桌面原高 96px。截图随窗口等比缩放，标注为真实 CSS 高度；“整页预览”可在实际网站中操作。
      </p>
      <p class="footnote">
        已确定缩小 25%，作为网站默认方案。以下为发布前的对照截图，手机搜索与菜单按钮保留 48px 点击高度。
      </p>
    </main>
    <script>
      for (const button of document.querySelectorAll('button[data-mode]')) {
        button.addEventListener('click', () => {
          const mode = button.dataset.mode
          document.body.dataset.mode = mode
          for (const item of document.querySelectorAll('button[data-mode]'))
            item.setAttribute('aria-pressed', String(item === button))
          for (const image of document.querySelectorAll('img[data-reduction]')) {
            image.src = `screenshots/${mode}-${image.dataset.reduction}.png`
            image.width = mode === 'mobile' ? 390 : 1440
            image.height = mode === 'mobile' ? 168 : 132
          }
          for (const value of document.querySelectorAll('.height'))
            value.textContent = `${value.dataset[mode]}px`
          document.querySelector('#context').textContent =
            `${mode === 'mobile' ? '手机原高 80px' : '桌面原高 96px'}。截图随窗口等比缩放，标注为真实 CSS 高度；“整页预览”可在实际网站中操作。`
        })
      }
    </script>
  </body>
</html>
